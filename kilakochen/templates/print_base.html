<!doctype html>
<html lang="de">
<head>
    {% block head %}
        <!-- Required meta tags -->
        <meta charset="utf-8">
        <meta name="viewport" content="width=device-width, initial-scale=1, shrink-to-fit=yes">

        {% block styles %}
            <!-- Bootstrap CSS -->
            {{ bootstrap.load_css() }}
        {% endblock %}
        <style>
            .small-font {
                font-size: xx-small
            }

            @page {
                size: A4 landscape;
                margin: 10mm;
            }

            .page-break {
                page-break-before: always;
            }
        </style>
        <title>{{ page_title }}</title>
    {% endblock %}
</head>
<body>
<div class="container">
    {% block content %}{% endblock %}
</div>

<footer>
    <div class="container text-center">
        Copyright: Kinderladen Jakobistraße e.V.
    </div>
</footer>
</body>
</html>
