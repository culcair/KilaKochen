{% extends 'base.html' %}

{% block content %}
        <div class="row justify-content-md-center">
        {{ page_title }} (Anzahl: {{ data |count}})
        </div>
        <table class="table">
            {% for recipe in data -%}
                <tr>
                    <td><a class="btn btn-primary" href="{{ url_for('main.recipe', id=recipe.ID) }}">Link</a></td>
                    <td>{{ recipe.Titel }}</td>
                </tr>
            {% endfor %}
        </table>

{% endblock %}
