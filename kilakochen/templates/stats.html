{% extends 'base.html' %}
{% block content %}
    <div class="container">
            <table>

            {% for id,meal in meals.items() | sort(attribute='1.count',reverse=True) %}

            	<tr>
            		<td>{{ meal.name }}</td>
            		<td>{{ meal.count }}</td>
                </tr>
            {% endfor %}
            </table>
    </div>
{% endblock %}
