
<!doctype html>
<html lang="de">
    <head>

        <title>{{ page_title }}</title>
        <link rel="shortcut icon" href="{{ url_for('static', filename='favicon.svg') }}">
        <!-- Required meta tags -->
        <meta charset="utf-8">
        <meta name="viewport" content="width=device-width, initial-scale=1, shrink-to-fit=no">
        <meta property="og:locale" content="de_DE">
        <meta property="og:type" content="website">
        <meta property="og:image" content="{{ url_for('static', filename='favicon.svg') }}">

        {%- block head -%}
        {%- endblock -%}

        {%- block styles %}
        <!-- Bootstrap CSS -->
        {{ bootstrap.load_css() }}
        {% endblock %}
    </head>
    <body>
        <header class="position-absolute w-100">
        {% include "incl_navbar.html" %}
		</header>


		<main class="flex-shrink-0" style='padding-top: 90px;padding-bottom: 40px;'>
            <!-- Start Main content -->
            {% block content %}
            {% endblock %}
            <!-- End Main content -->
        </main>	


        <footer class="footer mt-auto py-3 bg-light fixed-bottom">
            <!-- Footer -->
            {% include "incl_footer.html" %}
        </footer>
        {% block scripts %}
        <!-- Optional JavaScript -->
        {{ bootstrap.load_js() }}
    {% endblock %}
    </body>
</html>
