{% extends 'base.html' %}

{% block content %}
    <div class="container">
        <div class="row justify-content-md-center">
        {{ page_title }} (Anzahl: {{ data |count}})
        </div>
        <div>
            {% for entry in data -%}
                <div><a class="btn btn-primary" href="{{ url_for('main.rezepte', id=entry.rezept_id) }}">Link</a>{{ entry.rezept_name }}</div>
            {% endfor %}
        </div>
    </div>

{% endblock %}
