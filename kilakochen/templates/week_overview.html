{% extends 'base.html' %}

{% block content %}
<div class="container">
    <table class="table table-striped table-hover">
        <thead class="table-dark">
            <tr>
                <th>Auswahl KW</th>
                <th>Jahr</th>
                <th>Start</th>
                <th>Ende</th>
            </tr>
        </thead>
        {% for entry in weeks %}
        <tr>
            <td> <a class="btn btn-primary" href="{{ url_for('main.week',raw_date=entry.first) }}">{{entry.kw}}</a></td>
            <td> {{ entry.year }}</td>
            <td> {{ entry.first }}</td>
            <td> {{ entry.last }}</td>
        </tr>
        {% endfor %}
    </table>
       
</div>
{% endblock %}
